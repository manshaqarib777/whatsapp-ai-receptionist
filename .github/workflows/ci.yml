name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Test-only credentials for the ephemeral service container. Not a secret.
  DATABASE_URL: postgresql://war_test:war_test_password@localhost:5432/war_test?schema=public
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  LOG_LEVEL: error

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        # Must match docker/docker-compose.yml. Milestone 4 stores embeddings in
        # Postgres, and stock postgres:17-alpine has no vector extension — the
        # migration that runs CREATE EXTENSION vector would pass locally and fail here.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: war_test
          POSTGRES_PASSWORD: war_test_password
          POSTGRES_DB: war_test
        ports:
          - 5432:5432
        # Integration tests require a real database. Without this health gate the
        # suite can start before Postgres is ready and fail confusingly.
        options: >-
          --health-cmd "pg_isready -U war_test -d war_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        # .claude/SECURITY_RULES.md: high and critical vulnerabilities block the merge.
        run: npm audit --audit-level=high

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:deploy

      - name: Seed
        # The seed's own acceptance tests assert against this data
        # (src/lib/db/seed.integration.test.ts), and it is deterministic, so running it
        # here costs a second and keeps CI identical to a developer's database.
        run: npm run db:seed

      - name: Check schema drift
        # Prisma cannot express the HNSW index, so `migrate diff` proposes dropping it
        # on every run (Milestone 4, Issue 8). This step fails the build if the diff
        # contains ANYTHING beyond that known drop — an unreviewed generated migration
        # can no longer silently delete the vector index.
        run: npm run db:check-drift

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit, integration and component tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e -- --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
