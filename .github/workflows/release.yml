name: Release artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release version (for example, 2026.08.24-1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app.Dockerfile
          push: false
          tags: whatsapp-ai-receptionist:${{ inputs.version }}
          outputs: type=oci,dest=/tmp/whatsapp-ai-receptionist.tar
          provenance: mode=max
          sbom: true
      - name: Upload immutable OCI artifact
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-ai-receptionist-${{ inputs.version }}
          path: /tmp/whatsapp-ai-receptionist.tar
          retention-days: 14

      # Publishing and deployment are intentionally separate, environment-protected
      # operator actions. This workflow cannot mutate a registry or production service.
